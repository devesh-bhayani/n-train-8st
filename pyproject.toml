[project]
name = "n8st"
version = "0.1.0"
description = "Should the N train stop at 8 St–NYU? A simulation and ML study of the BMT Broadway line."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.4.6",
    "nyct-gtfs>=2.1.0",
    "pandas>=3.1.0",
    "polars>=1.10",
    "pyarrow>=17",
    "requests>=2.32",
]

[project.scripts]
n8st-shuttle-log = "n8st.shuttle.logger:main"
n8st-shuttle-summary = "n8st.shuttle.summarize:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n8st"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
