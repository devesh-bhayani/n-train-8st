# Logs NYU shuttle positions from Passio GO and commits them to the `shuttle-data` branch.
#
# GitHub's scheduler often skips hourly runs, so each run logs for ~5.5 hours and
# commits every hour. The schedule fires hourly; with the concurrency group below,
# one run is always queued behind the running one, so coverage is continuous even if
# most scheduled triggers are dropped. Overnight polls simply record no buses, which
# also tells us when service starts and ends.
#
# Cost: ~24 runner-hours a day. Free and unlimited on a PUBLIC repo only.
name: shuttle-logger
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to log, in minutes (max ~330)"
        default: "330"

permissions:
  contents: write

concurrency:
  group: shuttle-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev

      - name: Log shuttle positions, committing every hour
        id: log
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.minutes || '330' }}
        run: |
          chmod +x scripts/commit-to-branch.sh
          uv run n8st-shuttle-log --out _out --interval 30 --duration-min "$MINUTES" &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for _ in $(seq 360); do kill -0 "$pid" 2>/dev/null || break; sleep 10; done
            scripts/commit-to-branch.sh shuttle-data _out shuttle \
              "shuttle data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "commit failed; will retry"
          done
          wait "$pid"

      - name: Final commit
        if: always()
        run: |
          chmod +x scripts/commit-to-branch.sh
          scripts/commit-to-branch.sh shuttle-data _out shuttle \
            "shuttle data $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Summarize this run
        if: always()
        run: |
          if [ -d _out/polls ]; then
            { echo '```'; uv run n8st-shuttle-summary --dir _out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if no poll succeeded
        if: steps.log.outcome == 'failure'
        run: |
          echo "::error::Every Passio poll failed in this run. Check the logging step."
          exit 1
