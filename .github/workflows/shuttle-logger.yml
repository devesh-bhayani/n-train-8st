# Logs NYU shuttle positions from Passio GO and commits them to the `shuttle-data` branch.
#
# GitHub's scheduler often skips hourly runs (on Nov 3-4 it fired once in six hours),
# so each run logs for ~5.5 hours, commits every hour, and queues its own successor
# before it ends. With the concurrency group below, that successor waits for the
# running job, so coverage is continuous; the hourly schedule is only a backup that
# restarts the chain if it ever breaks. Overnight polls simply record no buses, which
# also tells us when service starts and ends.
#
# To stop logging: cancel the running job (a cancelled run doesn't queue a successor)
# or disable the workflow under Actions. A run that fails or lasts under 30 minutes
# doesn't queue one either, so a broken feed can't start a loop of failing runs. The
# chain also stops by itself after STOP_AFTER, the end of NYU's fall-term shuttle service.
#
# Cost: ~24 runner-hours a day. Free and unlimited on a PUBLIC repo only.
name: shuttle-logger
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to log, in minutes (max ~330)"
        default: "330"

permissions:
  contents: write
  actions: write  # to queue the next run

concurrency:
  group: shuttle-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev

      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Log shuttle positions, committing every hour
        id: log
        continue-on-error: true
        env:
          MINUTES: ${{ inputs.minutes || '330' }}
        run: |
          chmod +x scripts/commit-to-branch.sh
          uv run n8st-shuttle-log --out _out --interval 30 --duration-min "$MINUTES" &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for _ in $(seq 360); do kill -0 "$pid" 2>/dev/null || break; sleep 10; done
            scripts/commit-to-branch.sh shuttle-data _out shuttle \
              "shuttle data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "commit failed; will retry"
          done
          wait "$pid"

      - name: Final commit
        if: always()
        run: |
          chmod +x scripts/commit-to-branch.sh
          scripts/commit-to-branch.sh shuttle-data _out shuttle \
            "shuttle data $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Summarize this run
        if: always()
        run: |
          if [ -d _out/polls ]; then
            { echo '```'; uv run n8st-shuttle-summary --dir _out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The successor waits in the concurrency group and starts when this job ends.
      # (workflow_dispatch is one of the few events GITHUB_TOKEN may trigger.)
      - name: Queue the next run
        if: ${{ !cancelled() && steps.log.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STOP_AFTER: "2026-12-23"
        run: |
          ran=$(( $(date +%s) - STARTED ))
          if [[ "$(date -u +%F)" > "$STOP_AFTER" ]]; then
            echo "past $STOP_AFTER: not queueing another run"
          elif (( ran < 1800 )); then
            echo "this run lasted only ${ran}s: not queueing another (the schedule will retry)"
          else
            gh workflow run shuttle-logger.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f minutes=330
          fi

      - name: Fail if no poll succeeded
        if: steps.log.outcome == 'failure'
        run: |
          echo "::error::Every Passio poll failed in this run. Check the logging step."
          exit 1
