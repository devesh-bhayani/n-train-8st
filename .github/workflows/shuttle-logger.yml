# Logs NYU shuttle positions from Passio GO and commits them to the `shuttle-data`
# branch. Each run polls every 30 s for ~55 min; the schedule starts one run per hour.
#
# Cost: ~1 runner-hour per scheduled hour. Free and unlimited on a PUBLIC repo; a
# private repo's free quota (2,000 min/month) would run out in under two days.
#
# Hours are UTC. 11-23 and 0-5 UTC = 6 am to 1 am New York time while on EST
# (Nov 1, 2026 - Mar 14, 2027). After Mar 14, shift both ranges one hour earlier
# (10-23,0-4). NYU shuttles run about 7 am to midnight in term time.
name: shuttle-logger
on:
  schedule:
    - cron: "17 0-5,11-23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to log, in minutes"
        default: "55"

permissions:
  contents: write

concurrency:
  group: shuttle-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev

      - name: Log shuttle positions
        id: log
        continue-on-error: true
        run: uv run n8st-shuttle-log --out _out --interval 30 --duration-min "${{ inputs.minutes || '55' }}"

      - name: Summarize this run
        if: always()
        run: |
          if [ -d _out/polls ]; then
            { echo '```'; uv run n8st-shuttle-summary --dir _out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit to the shuttle-data branch
        if: always()
        run: |
          set -euo pipefail
          [ -d _out ] || { echo "no output"; exit 0; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin shuttle-data > /dev/null; then
            git fetch --depth=1 origin shuttle-data:refs/remotes/origin/shuttle-data
            git worktree add -B shuttle-data ../data-branch refs/remotes/origin/shuttle-data
          else
            git worktree add --orphan -b shuttle-data ../data-branch
          fi
          mkdir -p ../data-branch/shuttle
          cp -r _out/. ../data-branch/shuttle/
          cd ../data-branch
          git add shuttle
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "shuttle data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push -q origin HEAD:shuttle-data && exit 0
            sleep $((2 ** i))
            git fetch --depth=20 origin shuttle-data:refs/remotes/origin/shuttle-data
            git rebase refs/remotes/origin/shuttle-data
          done
          exit 1

      - name: Fail if no poll succeeded
        if: steps.log.outcome == 'failure'
        run: |
          echo "::error::Every Passio poll failed this hour. Check the 'Log shuttle positions' step."
          exit 1
